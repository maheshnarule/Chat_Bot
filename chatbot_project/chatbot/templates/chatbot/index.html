<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gemini Chatbot</title>
    <!-- Bootstrap CSS (CDN) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <style>
        body {
            background-color: #f8f9fa;
        }
        .chat-container {
            max-width: 800px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid #e9ecef;
            background: #0d6efd;
            color: #fff;
            border-radius: 10px 10px 0 0;
        }
        .chat-body {
            padding: 15px;
            overflow-y: auto;
            flex: 1;
        }
        .chat-footer {
            padding: 10px 15px 15px;
            border-top: 1px solid #e9ecef;
        }
        .message {
            margin-bottom: 12px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .message.user {
            margin-left: auto;
            background: #0d6efd;
            color: #fff;
            border-radius: 12px 12px 0 12px;
            padding: 10px 14px;
        }
        .message.bot {
            margin-right: auto;
            background: #e9ecef;
            border-radius: 12px 12px 12px 0;
            padding: 10px 14px;
        }
        .message small {
            display: block;
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }
        .typing-indicator {
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header d-flex justify-content-between align-items-center">
        <div>
            <h5 class="mb-0">Gemini 2.5 Flash Lite Chatbot</h5>
            <small>Ask anything in natural language</small>
        </div>
    </div>

    <div id="chat-body" class="chat-body">
        <div class="message bot">
            Hello! I am a chatbot powered by <strong>Gemini 2.5 Flash Lite</strong>.  
            How can I help you today?
            <small>Bot</small>
        </div>
    </div>

    <div class="chat-footer">
        <form id="chat-form" class="d-flex" autocomplete="off">
            <input
              id="message-input"
              type="text"
              class="form-control me-2"
              placeholder="Type your message..."
              required
            >
            <button id="send-btn" type="submit" class="btn btn-primary">
                Send
            </button>
        </form>
        <div id="typing" class="mt-2 typing-indicator text-muted d-none">
            Bot is typing...
        </div>
    </div>
</div>

<!-- Bootstrap JS (optional, for some components) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const chatBody = document.getElementById("chat-body");
    const chatForm = document.getElementById("chat-form");
    const messageInput = document.getElementById("message-input");
    const typingIndicator = document.getElementById("typing");
    const sendBtn = document.getElementById("send-btn");

    function appendMessage(text, sender) {
        const div = document.createElement("div");
        div.classList.add("message", sender);

        const smallLabel = sender === "user" ? "You" : "Bot";
        div.innerHTML = `
            <div>${text}</div>
            <small>${smallLabel}</small>
        `;
        chatBody.appendChild(div);
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    async function sendMessage(message) {
        typingIndicator.classList.remove("d-none");
        sendBtn.disabled = true;

        try {
            const response = await fetch("/api/chat/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();

            typingIndicator.classList.add("d-none");
            sendBtn.disabled = false;

            if (!response.ok) {
                appendMessage("Error: " + (data.error || "Unknown error"), "bot");
                return;
            }

            appendMessage(data.reply, "bot");
        } catch (error) {
            typingIndicator.classList.add("d-none");
            sendBtn.disabled = false;
            appendMessage("Network error: " + error.message, "bot");
        }
    }

    chatForm.addEventListener("submit", function (e) {
        e.preventDefault();
        const message = messageInput.value.trim();
        if (!message) return;

        appendMessage(message, "user");
        messageInput.value = "";
        sendMessage(message);
    });
</script>

</body>
</html>
